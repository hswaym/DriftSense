[pytest]
testpaths = tests
markers =
    p0: Phase P0 scaffold, bridge, and baseline invariants
    p1: Phase P1 world, infra, and pricing
    p2: Phase P2 faults, dirt, and dataset build
    p3: Phase P3 cleaning, gold tables, and realism
    p4: Phase P4 forecasting and conformal prediction
    p5: Phase P5 anomaly detection
    p6: Phase P6 attribution and root cause analysis
    p7: Phase P7 experiments and ablation studies
    p8: Phase P8 demo export and dashboard
    p9: Phase P9 final reporting and reproduction
    slow: marks tests as slow (deselect with '-m "not slow"')
