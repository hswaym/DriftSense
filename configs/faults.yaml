fault_types:
  deployment_regression:
    shape: "step"
    services: ["compute", "kubernetes"]
    duration_hours_range: [12, 72]
    severity_multiplier_range: [1.8, 3.5]
    held_out: false

  autoscaling_runaway:
    shape: "ramp"
    services: ["compute", "kubernetes"]
    duration_hours_range: [6, 48]
    severity_multiplier_range: [2.0, 4.5]
    held_out: false

  traffic_surge:
    shape: "decay"
    services: ["compute", "database", "cdn_egress"]
    duration_hours_range: [4, 24]
    severity_multiplier_range: [2.5, 5.0]
    held_out: false

  storage_leak:
    shape: "ramp"
    services: ["object_storage"]
    duration_hours_range: [48, 168]
    severity_multiplier_range: [1.5, 3.0]
    held_out: false

  instance_upsize:
    shape: "step"
    services: ["compute", "database"]
    duration_hours_range: [24, 120]
    severity_multiplier_range: [2.0, 4.0]
    held_out: false

  egress_spike:
    shape: "step"
    services: ["cdn_egress"]
    duration_hours_range: [6, 36]
    severity_multiplier_range: [3.0, 7.0]
    held_out: true # Appears ONLY in test period (months 11-12)

decoys:
  - name: "sale_event"
    type: "benign_traffic_lift"
    services: ["compute", "database", "cdn_egress"]
    duration_hours_range: [24, 72]
    multiplier_range: [1.8, 2.5]
  - name: "month_end_batch"
    type: "batch_processing"
    services: ["warehouse", "compute"]
    duration_hours_range: [8, 16]
    multiplier_range: [2.0, 3.5]
  - name: "holiday_dip"
    type: "dip"
    services: ["compute", "database"]
    duration_hours_range: [24, 48]
    multiplier_range: [0.4, 0.7]

incident_frequency:
  target_incidents_per_type_annual: 8
  target_decoys_annual: 10
  overlapping_fraction: 0.15
  confounded_scenarios_annual: 3
